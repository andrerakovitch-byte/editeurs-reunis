# Met le thème et l'extension en ligne chez Kinsta, à chaque poussée sur main qui les touche.
# Chaque passage installe et active les extensions dont le site a besoin (WooCommerce, Stripe, la nôtre).
# À la main (Actions → « Déployer chez Kinsta » → Run workflow), avec « installer » coché : le premier passage, qui
# active le thème, télécharge les langues et sème le contenu de l'ébauche (semer.php).
#
# Ne fait rien tant que les réglages ne sont pas posés (Settings → Secrets and variables → Actions) :
#   variables  KINSTA_HOTE, KINSTA_PORT, KINSTA_UTILISATEUR (MyKinsta → le site → Infos → Accès SFTP/SSH)
#   secret     KINSTA_CLE, la clé SSH privée dont la clé publique est enregistrée dans MyKinsta
# Le mode d'emploi est dans le README, « Déployer chez Kinsta ».
# Avec « evenements » coché : les rencontres de l'ancien site Wix (pages, vidéos de la chaîne YouTube), lues ici,
# converties (outils/wix/evenements.py) et importées ; le rapport des vidéos va sur la branche « wix-pages ».
name: Déployer chez Kinsta

on:
  push:
    branches: [main]
    paths: ['theme/**', 'plugin/**']
  workflow_dispatch:
    inputs:
      installer:
        description: "Premier passage : activer, ajouter les langues, semer le contenu de l'ébauche"
        type: boolean
        default: false
      couvertures:
        description: "Relevé des couvertures : le nombre de livres par qualité"
        type: boolean
        default: false
      evenements:
        description: "Les rencontres de l'ancien site : lire les pages et les vidéos, puis les importer (à relancer avant la bascule)"
        type: boolean
        default: false

concurrency: kinsta

permissions:
  contents: write

jobs:
  deployer:
    if: vars.KINSTA_HOTE != ''
    runs-on: ubuntu-latest
    env:
      HOTE: ${{ vars.KINSTA_HOTE }}
      PORT: ${{ vars.KINSTA_PORT }}
      QUI: ${{ vars.KINSTA_UTILISATEUR }}
    steps:
      - uses: actions/checkout@v4

      - name: La clé SSH
        env:
          CLE: ${{ secrets.KINSTA_CLE }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/kinsta
          chmod 600 ~/.ssh/kinsta
          ssh-keyscan -p "$PORT" "$HOTE" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH=ssh -i $HOME/.ssh/kinsta -p $PORT" >> "$GITHUB_ENV"

      - name: Le thème et l'extension
        run: |
          rsync -rlz --delete -e "$SSH" theme/editeurs-reunis/ "$QUI@$HOTE:public/wp-content/themes/editeurs-reunis/"
          rsync -rlz --delete -e "$SSH" plugin/er-librairie/ "$QUI@$HOTE:public/wp-content/plugins/er-librairie/"

      - name: Les extensions
        run: |
          $SSH "$QUI@$HOTE" 'cd public && set -e
            for e in woocommerce woocommerce-gateway-stripe er-librairie; do
              wp plugin is-installed "$e" || wp plugin install "$e"
              wp plugin is-active "$e" || wp plugin activate "$e"
            done
            wp rewrite flush'

      - name: Le premier passage
        if: inputs.installer
        run: |
          $SSH "$QUI@$HOTE" 'cd public && set -e
            wp theme activate editeurs-reunis
            wp language core install fr_FR ru_RU en_GB
            wp site switch-language fr_FR
            wp language plugin install woocommerce fr_FR ru_RU en_GB
            wp option update blog_public 0
            wp eval-file wp-content/plugins/er-librairie/donnees/semer.php
            wp rewrite structure "/%postname%/"
            wp rewrite flush'

      - name: Le relevé des couvertures
        if: inputs.couvertures
        run: $SSH "$QUI@$HOTE" 'cd public && wp er couvertures'

      - name: Les rencontres de l'ancien site (lire)
        if: inputs.evenements
        run: |
          pip install --quiet yt-dlp
          python3 outils/wix/pages.py evenements
          python3 outils/wix/pages.py medias
          python3 outils/wix/evenements.py sortie/evenements.json sortie/evenements-import.json --medias sortie/medias.json --rapport sortie/rapport.md
          cat sortie/rapport.md >> "$GITHUB_STEP_SUMMARY"

      - name: Les rencontres de l'ancien site (importer)
        if: inputs.evenements
        run: |
          $SSH "$QUI@$HOTE" 'mkdir -p private'
          rsync -z -e "$SSH" sortie/evenements-import.json "$QUI@$HOTE:private/evenements-import.json"
          $SSH "$QUI@$HOTE" 'cd public && wp er evenements importer ../private/evenements-import.json && wp rewrite flush && (wp kinsta cache purge --all || wp cache flush)' | tee sortie/import.txt
          # De quoi vérifier : la page de la liste et une rencontre avec sa vidéo, telles que le site les sert.
          URL=$($SSH "$QUI@$HOTE" 'cd public && wp option get home')
          curl -sL "$URL/centre-culturel/evenements/" -o sortie/page-liste.html || true
          curl -sL "$URL/centre-culturel/evenements/rencontre-avec-georges-nivat-ma-russie-de-17-a-90-ans/" -o sortie/page-nivat.html || true

      - name: Le rapport des rencontres, sur la branche wix-pages
        if: inputs.evenements
        run: |
          cd sortie && rm -rf brut
          git init -q -b wix-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Les rencontres de l'ancien site : import et rapport"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" wix-pages

      - name: Vider le cache
        run: $SSH "$QUI@$HOTE" 'cd public && (wp kinsta cache purge --all || wp cache flush)'
