# Met le thème et l'extension en ligne chez Kinsta, à chaque poussée sur main qui les touche, une fois le code vérifié.
# Chaque passage installe et active les extensions dont le site a besoin (WooCommerce, Stripe, la nôtre).
# À la main (Actions → « Déployer chez Kinsta » → Run workflow), avec « installer » coché : le premier passage, qui
# active le thème, télécharge les langues et sème le contenu de l'ébauche (semer.php).
#
# Ne fait rien tant que les réglages ne sont pas posés (Settings → Secrets and variables → Actions) :
#   variables  KINSTA_HOTE, KINSTA_PORT, KINSTA_UTILISATEUR (MyKinsta → le site → Infos → Accès SFTP/SSH)
#   secret     KINSTA_CLE, la clé SSH privée dont la clé publique est enregistrée dans MyKinsta
# Le mode d'emploi est dans le README, « Déployer chez Kinsta ».
# Avec « ancien_site » : les rencontres, le journal, les vidéos et les podcasts de l'ancien site Wix, lus ici (les
# pages, la chaîne YouTube, SoundCloud, le flux du podcast), convertis (outils/wix/*.py) et importés ; les rapports
# vont sur la branche « wix-pages ». Si Wix refuse trop de demandes (429), « importer les fichiers de la branche
# wix-pages » importe des fichiers déjà convertis. Avec « er » : une commande de l'extension (« sujets deviner »).
# Avec « boutique » : une commande de la boutique (« catalogue », « couvertures »), dont le rapport va sur la branche
# « boutique ».
name: Déployer chez Kinsta

on:
  push:
    branches: [main]
    paths: ['theme/**', 'plugin/**']
  workflow_dispatch:
    inputs:
      installer:
        description: "Premier passage : activer, ajouter les langues, semer le contenu de l'ébauche"
        type: boolean
        default: false
      couvertures:
        description: "Relevé des couvertures : le nombre de livres par qualité"
        type: boolean
        default: false
      ancien_site:
        description: "L'ancien site (rencontres, journal, vidéos et podcasts) : le lire puis l'importer (à relancer avant la bascule), ou importer les fichiers déjà sur la branche wix-pages"
        type: choice
        options: ['non', 'lire et importer', 'importer les fichiers de la branche wix-pages']
        default: 'non'
      er:
        description: "Une commande de l'extension, sans « wp er » (par exemple : sujets deviner)"
        default: ''
      boutique:
        description: "Une commande de la boutique, sans « wp er » (catalogue, couvertures…) : son rapport va sur la branche « boutique »"
        default: ''

concurrency: kinsta

permissions:
  contents: write

jobs:
  # Rien ne part chez Kinsta si le contrôle échoue : syntaxe, tests, style et règles de sécurité (verifier.yml).
  verifier:
    uses: ./.github/workflows/verifier.yml

  deployer:
    needs: verifier
    if: vars.KINSTA_HOTE != ''
    runs-on: ubuntu-latest
    env:
      HOTE: ${{ vars.KINSTA_HOTE }}
      PORT: ${{ vars.KINSTA_PORT }}
      QUI: ${{ vars.KINSTA_UTILISATEUR }}
    steps:
      - uses: actions/checkout@v5

      - name: La clé SSH
        env:
          CLE: ${{ secrets.KINSTA_CLE }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/kinsta
          chmod 600 ~/.ssh/kinsta
          ssh-keyscan -p "$PORT" "$HOTE" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH=ssh -i $HOME/.ssh/kinsta -p $PORT" >> "$GITHUB_ENV"

      - name: Le thème et l'extension
        run: |
          rsync -rlz --delete -e "$SSH" theme/editeurs-reunis/ "$QUI@$HOTE:public/wp-content/themes/editeurs-reunis/"
          rsync -rlz --delete -e "$SSH" plugin/er-librairie/ "$QUI@$HOTE:public/wp-content/plugins/er-librairie/"

      # Polylang Pro et Polylang pour WooCommerce sont payants : téléversés à la main dans l'administration, jamais
      # par ce dépôt ; activés ici dès qu'ils sont là (wp er langues installer règle ensuite les trois langues).
      # WooPayments ferait doublon avec Stripe (Apple Pay et Google Pay deux fois) : retiré.
      # Pas d'apostrophe droite dans la commande ci-dessous : elle est entre guillemets simples.
      - name: Les extensions
        run: |
          $SSH "$QUI@$HOTE" 'cd public && set -e
            for e in woocommerce woocommerce-gateway-stripe er-librairie; do
              wp plugin is-installed "$e" || wp plugin install "$e"
              wp plugin is-active "$e" || wp plugin activate "$e"
            done
            for e in polylang-pro polylang-wc; do
              if wp plugin is-installed "$e"; then wp plugin is-active "$e" || wp plugin activate "$e"; fi
            done
            if wp plugin is-installed woocommerce-payments; then
              wp plugin deactivate woocommerce-payments || true
              wp plugin delete woocommerce-payments
            fi
            wp rewrite flush'

      - name: Le premier passage
        if: inputs.installer
        run: |
          $SSH "$QUI@$HOTE" 'cd public && set -e
            wp theme activate editeurs-reunis
            wp language core install fr_FR ru_RU en_GB
            wp site switch-language fr_FR
            wp language plugin install woocommerce fr_FR ru_RU en_GB
            wp option update blog_public 0
            wp eval-file wp-content/plugins/er-librairie/donnees/semer.php
            wp rewrite structure "/%postname%/"
            wp rewrite flush'

      - name: Le relevé des couvertures
        if: inputs.couvertures
        run: $SSH "$QUI@$HOTE" 'cd public && wp er couvertures'

      - name: L'ancien site (lire et convertir)
        if: inputs.ancien_site == 'lire et importer'
        run: |
          pip install --quiet yt-dlp beautifulsoup4
          python3 outils/wix/pages.py evenements
          python3 outils/wix/pages.py journal
          python3 outils/wix/pages.py medias
          python3 outils/wix/evenements.py sortie/evenements.json sortie/evenements-import.json --medias sortie/medias.json --rapport sortie/rapport.md
          python3 outils/wix/journal.py sortie/journal.json sortie/journal-import.json --rapport sortie/rapport-journal.md
          python3 outils/wix/medias.py sortie/evenements.json sortie/medias.json sortie/medias-import.json
          cat sortie/rapport.md sortie/rapport-journal.md >> "$GITHUB_STEP_SUMMARY"

      - name: L'ancien site (les fichiers de la branche wix-pages)
        if: inputs.ancien_site == 'importer les fichiers de la branche wix-pages'
        run: |
          mkdir -p sortie
          git fetch -q origin wix-pages
          for f in evenements-import.json journal-import.json medias-import.json rapport.md rapport-journal.md; do
            git show "origin/wix-pages:$f" > "sortie/$f" 2>/dev/null || rm -f "sortie/$f"
          done
          ls -la sortie

      - name: L'ancien site (importer)
        if: inputs.ancien_site == 'lire et importer' || inputs.ancien_site == 'importer les fichiers de la branche wix-pages'
        run: |
          $SSH "$QUI@$HOTE" 'mkdir -p private && rm -f private/*-import.json'
          for f in evenements-import.json journal-import.json medias-import.json; do
            if [ -s "sortie/$f" ]; then rsync -z -e "$SSH" "sortie/$f" "$QUI@$HOTE:private/$f"; fi
          done
          $SSH "$QUI@$HOTE" 'cd public
            for f in evenements medias journal; do
              if [ -s "../private/$f-import.json" ]; then wp er "$f" importer "../private/$f-import.json"; fi
            done
            wp rewrite flush
            wp kinsta cache purge --all || wp cache flush' | tee sortie/import.txt
          # De quoi vérifier : quelques pages telles que le site les sert.
          URL=$($SSH "$QUI@$HOTE" 'cd public && wp option get home')
          curl -sL "$URL/centre-culturel/evenements/" -o sortie/page-liste.html || true
          curl -sL "$URL/auteur/alexandre-soljenitsyne/" -o sortie/page-soljenitsyne.html || true
          curl -sL "$URL/sujet/poesie/" -o sortie/page-poesie.html || true
          curl -sL "$URL/post/du-jardin-secret-des-lykov-vieux-croyants-de-siberie" -o sortie/page-article.html || true
          curl -sL "$URL/wp-json/er/v1/chercher?q=raskol" -o sortie/recherche-raskol.json || true
          curl -sL "$URL/journal/" -o sortie/page-journal.html || true
          curl -sL "$URL/journal/genre/critique/" -o sortie/page-critiques.html || true
          curl -sL "$URL/centre-culturel/expositions/" -o sortie/page-expositions.html || true
          curl -sL "$URL/centre-culturel/expositions/derniers-regards/" -o sortie/page-exposition.html || true

      - name: Une commande de l'extension
        if: inputs.er != ''
        env:
          COMMANDE: ${{ inputs.er }}
        run: |
          mkdir -p sortie
          # Seulement des mots, des tirets et des signes égal : pas de quoi glisser une autre commande.
          echo "$COMMANDE" | grep -Eq '^[a-z0-9 =_-]+$' || { echo "Commande refusée : $COMMANDE"; exit 1; }
          $SSH "$QUI@$HOTE" "cd public && wp er $COMMANDE" | tee sortie/commande.txt

      - name: Le rapport, sur la branche wix-pages
        if: inputs.ancien_site == 'lire et importer' || inputs.ancien_site == 'importer les fichiers de la branche wix-pages' || inputs.er != ''
        run: |
          rm -rf sortie/brut
          cd sortie
          git init -q -b wix-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # Les fichiers des passages précédents restent : on ajoute ceux-ci par-dessus.
          if git fetch -q --depth 1 origin wix-pages; then git reset -q --soft FETCH_HEAD; fi
          git add --ignore-removal .
          git commit -q -m "L'ancien site : import et rapport" || exit 0
          git push -q origin HEAD:wix-pages

      # La boutique a sa branche de rapports, « boutique » : des comptes seulement (le dépôt est public), jamais de
      # chiffres de ventes. Chaque commande y laisse son fichier, remplacé au passage suivant.
      - name: Une commande de la boutique
        if: inputs.boutique != ''
        env:
          COMMANDE: ${{ inputs.boutique }}
        run: |
          set -o pipefail
          echo "$COMMANDE" | grep -Eq '^[a-z0-9 =_-]+$' || { echo "Commande refusée : $COMMANDE"; exit 1; }
          mkdir -p rapport-boutique
          FICHIER="rapport-boutique/$(echo "$COMMANDE" | tr ' =' '--' | tr -s '-').md"
          {
            echo "# wp er $COMMANDE"
            echo
            echo "Le $(TZ=Europe/Paris date '+%d/%m/%Y à %H h %M'), sur $($SSH "$QUI@$HOTE" 'cd public && wp option get home')."
            echo
            echo '```'
            $SSH "$QUI@$HOTE" "cd public && wp er $COMMANDE"
            echo '```'
          } | tee "$FICHIER"
          cat "$FICHIER" >> "$GITHUB_STEP_SUMMARY"

      - name: Le rapport de la boutique, sur la branche boutique
        if: inputs.boutique != ''
        env:
          COMMANDE: ${{ inputs.boutique }}
        run: |
          cd rapport-boutique
          git init -q -b boutique
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin boutique; then git reset -q --soft FETCH_HEAD; fi
          git add --ignore-removal .
          git commit -q -m "La boutique : wp er $COMMANDE" || exit 0
          git push -q origin HEAD:boutique

      - name: Vider le cache
        run: $SSH "$QUI@$HOTE" 'cd public && (wp kinsta cache purge --all || wp cache flush)'
