# Lit des pages publiques de l'ancien site Wix (editeurs-reunis.fr), injoignable depuis l'espace de travail de Claude :
# outils/wix/pages.py. Le résultat est déposé sur la branche à part « wix-pages » (chaque passage y ajoute ses fichiers),
# jamais sur main ; Claude la lit par git (les artefacts des workflows ne lui sont pas joignables). Ce ne sont que des pages
# publiques du site.
name: Lire l'ancien site Wix

on:
  workflow_dispatch:
    inputs:
      quoi:
        description: "plan, evenements, journal ou medias"
        default: plan
      brut:
        description: "Garder le HTML des N premières pages (pour lire leur forme)"
        default: "0"
      pages:
        description: "medias : des pages d'événement à relire, séparées par des virgules"
        default: ""

permissions:
  contents: write

jobs:
  lire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: yt-dlp (la liste des vidéos des chaînes citées, sans rien télécharger)
        if: inputs.quoi == 'medias'
        run: pip install --quiet yt-dlp
      - name: Lire
        # Les entrées passent par l'environnement, jamais écrites telles quelles dans le script (audit du 27 nov. 2026).
        env:
          QUOI: ${{ inputs.quoi }}
          BRUT: ${{ inputs.brut }}
          PAGES: ${{ inputs.pages }}
        run: python3 outils/wix/pages.py "$QUOI" --brut "$BRUT" --pages "$PAGES"
      - name: Déposer sur la branche wix-pages
        env:
          QUOI: ${{ inputs.quoi }}
        run: |
          cd sortie
          git init -q -b wix-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # Les fichiers des passages précédents restent : on ajoute ceux-ci par-dessus.
          if git fetch -q --depth 1 origin wix-pages; then git reset -q --soft FETCH_HEAD; fi
          git add --ignore-removal .
          git commit -q -m "Pages lues de l'ancien site : $QUOI" || exit 0
          git push -q origin HEAD:wix-pages
